<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link th:href="@{/style.css?v=1}" rel="stylesheet">
    <meta charset="UTF-8">
    <title>New Wishlist</title>
</head>
<body>

<!--<div th:replace="~{fragments/header :: header}"></div>-->

<main>
    <h1>Create a wishlist!</h1>
    <form th:action="@{/user/{path}/wishlist/add(path=${ID})}" th:object="${wishlistDTO}" method="post">
        <fieldset>
            <label for="title">Title</label>
            <input id="title" th:field="*{wishlistTitle}" required>

            <label for="heldOn">Event Date</label>
            <input type="date" id="heldOn" th:field="*{wishlistHeldOn}" required>

            <fieldset>
                <legend>Add Products</legend>
                <div th:each="product : ${allProducts}">
                    <input type="checkbox" th:id="'product-' + ${product.getID()}" th:value="${product.getID()}" th:text="${product.getTitle()}" th:field="*{productIDs}">
                    <label for="description">Description</label>
                    <input id="description" type="text" th:field="*{productDescriptions}" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Add guests</legend>
                <div th:each="user : ${allUsers}">
                    <input type="checkbox" th:id="'product-' + ${user.getID()}" th:value="${user.getID()}" th:text="${user.getUsername()}" th:field="*{guestIDs}">
                </div>
            </fieldset>
        </fieldset>

        <input type="submit" value="Create Wishlist" />
        <a th:href="@{'/user/' + ${ID}}">Cancel</a>
    </form>
</main>

<!--<div th:replace="~{fragments/footer :: footer}"></div>-->

</body>
</html>
