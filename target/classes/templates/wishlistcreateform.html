<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link th:href="@{/style.css?v=1}" rel="stylesheet">
    <meta charset="UTF-8">
    <title>New Wishlist</title>
</head>
<body>

<!--<div th:replace="~{fragments/header :: header}"></div>-->

<main>
    <h1>Add Products</h1>
    <form th:action="@{/user/{path}/wishlist/add(path=${ID})}" th:object="${newWishlist}" method="post">
        <fieldset>
            <label for="title">Title</label>
            <input id="title" th:field="${newWishlist.title}">

            <label for="heldOn">Event Date</label>
            <input id="heldOn" th:field="${newWishlist.heldOn}">

            <fieldset id="products">
                <label for="products">Products</label>
                <div th:each="option, iter : ${allWishlistProducts}">
                    <input type="checkbox" th:id="${'product-' + iter.index}" th:field="*{products}" th:value="${option.getProduct().getID()}"/>
                    <label th:for="${'product-' + iter.index}" th:text="${option.getProduct().getTitle()}"></label>
                </div>
            </fieldset>

            <button type="submit">Create Wishlist</button>
            <a th:href="@{'/user/' + ${ID}}">Cancel</a>
        </fieldset>
    </form>
</main>

<!--<div th:replace="~{fragments/footer :: footer}"></div>-->

</body>
</html>
