<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <link rel="stylesheet" type="text/css" th:href="@{/style.css?v=1}">
</head>
<body>
<h2>Update User</h2>


<form th:action="@{/user/{path}/update(path=${ID})}" th:object="${userDTO}" method="post">

  <label for="name">Full Name:</label>
  <input type="text" id="name" th:field="*{name}" required>

  <label for="username">Username:</label>
  <input type="text" id="username" th:field="*{username}" required>

  <label for="password">Password:</label>
  <input type="text" id="password" th:field="*{password}" required>

  <button type="submit">Update User</button>
  <a th:href="@{'/user/' + ${ID}}">Cancel</a>


</form>
</body>
</html>
