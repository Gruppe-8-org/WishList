<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" type="text/css" th:href="@{/style.css?v=1}">
</head>
<body>
<h2>Add Product</h2>


<form th:action="@{/user/products/add}" th:object="${newProduct}" method="post">

    <label for="title">Product Title:</label>
    <input type="text" id="title" th:field="*{title}" required>

    <label for="manufacturer">Manufacturer:</label>
    <input type="text" id="manufacturer" th:field="*{manufacturer}" required>

    <label for="price">Price:</label>
    <input type="text" id="price" th:field="*{price}" required>

    <button type="submit">Add Product</button>
    <a th:href="@{/}">Cancel</a>

</form>
</body>
</html>
