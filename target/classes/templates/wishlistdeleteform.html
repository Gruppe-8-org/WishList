<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link th:href="@{/style.css?v=1}" rel="stylesheet">
    <meta charset="UTF-8">
    <title th:text="${deleteWishlist.title}"></title>
</head>
<body>

<!--<div th:replace="~{fragments/header :: header}"></div>-->

<main>
    <form th:action="@{/user/{path}/wishlist/{path2}/delete(path=${UID},path2=${deleteWishlist.ID})}" th:object="${deleteWishlist}"  method="post">
        <h1 th:text="${deleteWishlist.title}"></h1>
        <h2 th:text="${deleteWishlist.heldOn}"></h2>
        <button type="submit">Confirm Deletion</button>
        <a th:href="@{'/user/' + ${UID}}">Cancel Deletion</a>
    </form>
</main>

<!--<div th:replace="~{fragments/footer :: footer}"></div>-->

</body>
</html>
