<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" type="text/css" th:href="@{/style.css?v=1}">
</head>
<body>
<h2>Submit Credentials</h2>


<form th:action="@{/user/login}" th:object="${loggedUser}" method="post">


    <label for="username">Username:</label>
    <input type="text" id="username" th:field="*{username}" required>

    <label for="password">Password:</label>
    <input type="text" id="password" th:field="*{password}" required>

    <button type="submit">Login</button>
    <a th:href="@{/}">Cancel</a>

</form>
</body>
</html>
