<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link th:href="@{/style.css?v=1}" rel="stylesheet">
    <meta charset="UTF-8">
    <title th:text="${wishlistDTO.getWishlistTitle()}"></title>
</head>
<body>

<!-- <div th:replace="~{fragments/header :: header}"></div> -->

<main>
    <h1>Update a wishlist!</h1>
    <form th:action="@{/user/{path}/wishlist/{path2}/update(path=${uid},path2=${WID})}" th:object="${wishlistDTO}" method="post">
        <fieldset>
            <label for="title">Title</label>
            <input id="title" th:field="*{wishlistTitle}" th:value="${wishlistDTO.getWishlistTitle()}" required>

            <label for="heldOn">Event Date</label>
            <input type="date" id="heldOn" th:field="*{wishlistHeldOn}" th:value="${wishlistDTO.getWishlistHeldOn()}" required>

            <fieldset>
                <legend>Update Products</legend>
                <div th:each="product, iter : ${allProducts}">
                    <input type="checkbox"
                           th:id="'product-' + ${product.getID()}"
                           th:value="${product.getID()}"
                           th:text="${product.getTitle()}"
                           th:field="*{productIDs}"
                           th:checked="${wishlistDTO.getProductIDs().contains(product.getID())}">

                    <label th:for="'description-' + ${iter.index}">Description</label>
                    <input type="text"
                           th:id="'description-' + ${iter.index}"
                           th:name="'productDescriptions[' + ${iter.index} + ']'"
                           th:value="${wishlistDTO.productDescriptions.size() > iter.index ? wishlistDTO.productDescriptions[iter.index] : ''}">
                </div>
            </fieldset>

            <fieldset>
                <legend>Update guests</legend>
                <div th:each="user : ${allUsers}">
                    <input type="checkbox" th:id="'product-' + ${user.getID()}" th:value="${user.getID()}" th:text="${user.getUsername()}" th:field="*{guestIDs}" th:checked="${wishlistDTO.getGuestIDs().contains(user.getID())}">
                </div>
            </fieldset>
        </fieldset>

        <input type="submit" value="Update Wishlist" />
        <a th:href="@{'/user/' + ${ID}}">Cancel</a>
    </form>
</main>

<!-- <div th:replace="~{fragments/footer :: footer}"></div> -->

</body>
</html>
